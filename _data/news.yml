# News feed shown on /news/, rendered newest first.
#
# Fields:
#   date     (required) YYYY-MM-DD if known, otherwise just YYYY. Used for sorting.
#   kind     (required) label shown above the title, e.g. Workshop, Talk, Abstract,
#            Paper, Media, Recognition
#   title    (required)
#   venue    where it happened or was published
#   summary  one or two sentences, shown as the post body (optional)
#   url      link for the title and the "Read more" link (optional)
#   link_text  text for the link (default: "Read more")
#   role     small tag such as "organizer", "first author", "co-author" (optional)
#   image    picture under assets/img/ (e.g. news/act-africa.jpg) or a full https://
#            URL (optional; shown on the homepage cards and the news page)
#   image_credit  photographer credit shown on the news page (optional)
#   image_alt  description of the picture for screen readers (optional)
#   image_position  which part to keep when cropping: center (default), top, bottom
#
# To add a post, copy an entry and edit it. Order in this file doesn't matter.


- date: "2026-05-28"
  kind: Talk
  title: "Trustworthy AI Tools for Science: A Philosophical, Computational, and Experimental Perspective"
  venue: "109th Canadian Chemistry Conference & 76th Canadian Chemical Engineering Conference (x2026) · Session: Applied AI/ML in Chemistry and Chemical Engineering Research"
  summary: >-
    Trustworthiness for scientific AI/ML along three dimensions: philosophical
    frameworks for human alignment in the lab, explainable uncertainty
    quantification (xUQ) to diagnose a model that fails to make trustworthy
    predictions, and progress toward using xUQ in an autonomous battery-testing
    experiment. With Jason Hattrick-Simpers.
  url: https://www.xcdsystem.com/cic/program/1GHc9M3/index.cfm?pgid=3216&sid=31450&abid=125209
  link_text: Abstract
  role: speaker
  image: news/toronto_web.jpg
  image_alt: Toronto skyline with the CN Tower, seen across Lake Ontario

